
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RKoodle - Your LMS. Your Cloud.</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}
header{background:#102b50;color:white;padding:20px 7%;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.logo{font-size:27px;font-weight:bold;color:#fff}
nav a{color:white;text-decoration:none;margin-left:18px}
.hero{text-align:center;padding:55px 15px 35px;background:linear-gradient(135deg,#102b50,#1766a5);color:white}
.hero h1{font-size:38px;margin:0 0 12px}
.hero p{font-size:17px}
.container{max-width:950px;margin:30px auto;padding:15px}
.plans{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
.plan{background:white;border-radius:12px;padding:25px;width:270px;text-align:center;box-shadow:0 4px 15px #00000012}
.plan h2{color:#1766a5}
.price{font-size:27px;font-weight:bold}
.account{background:white;max-width:440px;margin:35px auto;padding:25px;border-radius:12px;box-shadow:0 4px 18px #00000015}
.tabs{display:flex;margin-bottom:22px}
.tabs button{width:50%;padding:13px;border:0;background:#e8eef5;cursor:pointer;font-size:16px}
.tabs button.active{background:#1766a5;color:white}
input{width:100%;padding:13px;margin:8px 0 15px;border:1px solid #ccd5e0;border-radius:6px;font-size:15px}
.action{width:100%;padding:13px;background:#1766a5;color:white;border:0;border-radius:6px;font-size:16px;cursor:pointer}
.action:disabled{opacity:.6}
#message{margin-top:15px;font-size:14px;overflow-wrap:anywhere}
footer{text-align:center;padding:25px;color:#667}
.hidden{display:none}
@media(max-width:500px){.hero h1{font-size:30px}header{padding:18px}.plan{width:100%}}
</style>
</head>
<body>

<header>
  <div class="logo">RKoodle</div>
  <nav>
    <a href="#plans">Plans</a>
    <a href="#account">Account</a>
    <a href="dashboard.html">Dashboard</a>
  </nav>
</header>

<section class="hero">
  <h1>Your LMS. Your Cloud.</h1>
  <p>Launch and manage your own learning platform with RKoodle.</p>
</section>

<div class="container" id="plans">
  <div class="plans">
    <div class="plan">
      <h2>Free Plan</h2>
      <div class="price">₹0</div>
      <p>5 GB Storage</p>
      <p>Explore RKoodle</p>
    </div>
    <div class="plan">
      <h2>Pro Plan</h2>
      <div class="price">$50/year</div>
      <p>20 GB Storage</p>
      <p>For growing institutions</p>
    </div>
  </div>

  <div class="account" id="account">
    <div class="tabs">
      <button id="signupTab" class="active" type="button">Sign Up</button>
      <button id="signinTab" type="button">Sign In</button>
    </div>

    <form id="signupForm">
      <h2>Create Your Account</h2>
      <input id="fullName" type="text" placeholder="Full Name" required>
      <input id="signupEmail" type="email" placeholder="Email Address" required>
      <input id="signupPassword" type="password" placeholder="Create Password (minimum 6 characters)" minlength="6" required>
      <button class="action" id="signupButton" type="submit">Create Account</button>
    </form>

    <form id="signinForm" class="hidden">
      <h2>Welcome Back</h2>
      <input id="signinEmail" type="email" placeholder="Email Address" required>
      <input id="signinPassword" type="password" placeholder="Password" required>
      <button class="action" id="signinButton" type="submit">Sign In</button>
    </form>

    <div id="message" role="status"></div>
  </div>
</div>

<footer>© 2026 RKoodle. Your LMS. Your Cloud.</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  updateProfile,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDf20ZFbqmc9kjUbzT8H36WYUKLRI6i_t",
  authDomain: "rkoodle.firebaseapp.com",
  projectId: "rkoodle",
  storageBucket: "rkoodle.firebasestorage.app",
  messagingSenderId: "526883526247",
  appId: "1:526883526247:web:24979b028769dae25066c2"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const signupForm = document.getElementById("signupForm");
const signinForm = document.getElementById("signinForm");
const message = document.getElementById("message");
const signupButton = document.getElementById("signupButton");
const signinButton = document.getElementById("signinButton");

document.getElementById("signupTab").addEventListener("click", () => {
  signupForm.classList.remove("hidden");
  signinForm.classList.add("hidden");
  document.getElementById("signupTab").classList.add("active");
  document.getElementById("signinTab").classList.remove("active");
  message.textContent = "";
});

document.getElementById("signinTab").addEventListener("click", () => {
  signinForm.classList.remove("hidden");
  signupForm.classList.add("hidden");
  document.getElementById("signinTab").classList.add("active");
  document.getElementById("signupTab").classList.remove("active");
  message.textContent = "";
});

function showMessage(text, success = false) {
  message.textContent = text;
  message.style.color = success ? "green" : "crimson";
}

function readableError(error) {
  const errors = {
    "auth/email-already-in-use": "This email is already registered. Please sign in.",
    "auth/invalid-email": "Please enter a valid email address.",
    "auth/weak-password": "Password must contain at least 6 characters.",
    "auth/invalid-credential": "Incorrect email or password.",
    "auth/too-many-requests": "Too many attempts. Please try again later.",
    "auth/network-request-failed": "Internet connection problem. Please try again."
  };
  return errors[error.code] || "Something went wrong: " + error.message;
}

signupForm.addEventListener("submit", async (event) => {
  event.preventDefault();
  signupButton.disabled = true;
  showMessage("Creating your account...");

  const name = document.getElementById("fullName").value.trim();
  const email = document.getElementById("signupEmail").value.trim();
  const password = document.getElementById("signupPassword").value;

  try {
    const result = await createUserWithEmailAndPassword(auth, email, password);
    await updateProfile(result.user, { displayName: name });
    showMessage("Account created successfully! You are now signed in.", true);
    signupForm.reset();
  } catch (error) {
    showMessage(readableError(error));
  } finally {
    signupButton.disabled = false;
  }
});

signinForm.addEventListener("submit", async (event) => {
  event.preventDefault();
  signinButton.disabled = true;
  showMessage("Signing in...");

  const email = document.getElementById("signinEmail").value.trim();
  const password = document.getElementById("signinPassword").value;

  try {
    await signInWithEmailAndPassword(auth, email, password);
    showMessage("Login successful! You are signed in.", true);
    signinForm.reset();
  } catch (error) {
    showMessage(readableError(error));
  } finally {
    signinButton.disabled = false;
  }
});

onAuthStateChanged(auth, (user) => {
  if (user) {
    message.textContent = "Signed in as " + (user.displayName || user.email);
    message.style.color = "green";

    if (!document.getElementById("logoutButton")) {
      const logoutButton = document.createElement("button");
      logoutButton.id = "logoutButton";
      logoutButton.className = "action";
      logoutButton.style.marginTop = "12px";
      logoutButton.textContent = "Sign Out";
      logoutButton.addEventListener("click", async () => {
        await signOut(auth);
        showMessage("You have signed out.", true);
        logoutButton.remove();
      });
      message.after(logoutButton);
    }
  }
});
</script>
</body>
</html>
