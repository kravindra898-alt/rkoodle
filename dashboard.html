<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RKoodle Customer Dashboard</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f4f6ff;color:#172554}
header{background:#312e81;color:white;padding:20px 7%;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:25px;font-weight:bold}
button{background:#4f46e5;color:white;border:0;padding:11px 18px;border-radius:7px;cursor:pointer}
main{max-width:1050px;margin:35px auto;padding:15px}
h1{font-size:28px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.card{background:white;padding:24px;border-radius:12px;box-shadow:0 3px 15px #ddd}
.card h3{color:#6366f1}
.value{font-size:26px;font-weight:bold;margin:15px 0}
.progress{height:12px;background:#e5e7eb;border-radius:20px;overflow:hidden}
.bar{height:100%;width:20%;background:#4f46e5}
.website{margin-top:22px;background:white;padding:25px;border-radius:12px}
footer{text-align:center;padding:25px;color:#666}
</style>
</head>
<body>

<header>
<div class="logo">RKoodle</div>
<button onclick="alert('Demo only: Logout will be enabled later.')">Logout</button>
</header>

<main>
<h1>Welcome to Your Dashboard!</h1>
<p>Manage your learning platform from one place.</p>

<div class="cards">

<div class="card">
<h3>Current Plan</h3>
<div class="value">Free</div>
<p>5 GB Storage</p>
<button onclick="alert('Upgrade system coming soon.')">Upgrade Plan</button>
</div>

<div class="card">
<h3>Storage Used</h3>
<div class="value">1 GB / 5 GB</div>
<div class="progress"><div class="bar"></div></div>
<p>4 GB Available</p>
</div>

<div class="card">
<h3>Extra Storage</h3>
<div class="value">20 GB</div>
<p>$50 / Year</p>
<button onclick="alert('Extra storage purchase coming soon.')">Add Storage</button>
</div>

</div>

<div class="website">
<h2>My Moodle Website</h2>
<p>Your Moodle website has not been created yet.</p>
<button onclick="alert('Automatic Moodle website creation will be enabled later.')">Create My Website</button>
</div>

</main>

<footer>© 2026 RKoodle | Customer Dashboard</footer>

</body>
</html>
