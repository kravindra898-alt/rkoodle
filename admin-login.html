<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RKoodle Admin Login</title>
<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#312e81,#6366f1);
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}
.login{
background:white;
width:100%;
max-width:400px;
padding:35px;
border-radius:15px;
box-shadow:0 10px 35px #2225;
text-align:center;
}
.logo{font-size:30px;font-weight:bold;color:#4338ca}
h2{margin-top:25px;color:#172554}
input{
width:100%;
padding:14px;
margin:10px 0;
border:1px solid #ccc;
border-radius:7px;
}
button{
width:100%;
padding:14px;
margin-top:15px;
background:#4338ca;
color:white;
border:0;
border-radius:7px;
font-weight:bold;
}
p{color:#666;font-size:13px}
</style>
</head>
<body>

<div class="login">
<div class="logo">RKoodle</div>
<h2>Admin Login</h2>
<p>Sign in to manage your hosting platform</p>

<form onsubmit="event.preventDefault();alert('Demo only. Secure admin login is not active yet.');">
<input type="email" placeholder="Admin Email" required>
<input type="password" placeholder="Password" required>
<button type="submit">Login</button>
</form>

<p>Authorized administrators only</p>
</div>

</body>
</html>
